<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<style id="no-flash">html,body{background:#0A0A09;color:#F4F2EC;margin:0}</style>
<script src="./support.js"></script>
</head>
<body style="background:#0A0A09">
<x-dc>
<helmet>
<title>Artigo — Boanerges</title>
<link rel="icon" type="image/png" href="assets/brand/symbol-yellow.png">
<link rel="apple-touch-icon" href="assets/brand/symbol-yellow.png">
<link rel="stylesheet" href="https://use.typekit.net/lki5cby.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth;scroll-padding-top:56px;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
body{margin:0;background:#0A0A09;color:#F4F2EC;font-family:'arpona','Figtree',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#FFC907;text-decoration:none}
a:hover{color:#F4F2EC}
</style>
<script src="artigos.js"></script>
</helmet>
<div style="min-height:100vh;background:#0A0A09;display:flex;flex-direction:column">
<header style="position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(12px,2.5vw,22px) clamp(16px,4vw,56px);background:rgba(10,10,9,0.86);backdrop-filter:blur(8px)">
  <a href="/" style="display:flex;align-items:center">
    <img src="assets/brand/symbol-yellow.png" alt="Boanerges" style="height:clamp(24px,6vw,30px);width:auto;display:block;flex-shrink:0">
  </a>
  <nav style="display:flex;align-items:center;gap:clamp(12px,3.5vw,40px);font-size:clamp(10.5px,2.9vw,13px);font-weight:600;letter-spacing:clamp(0.03em,0.6vw,0.08em);text-transform:uppercase;white-space:nowrap">
    <a href="/" style="color:#F4F2EC;padding:12px 0" style-hover="color:#FFC907">Home</a>
    <a href="/lancamentos" style="color:#F4F2EC;padding:12px 0" style-hover="color:#FFC907">Lançamentos</a>
    <a href="/artigos" style="color:#FFC907;padding:12px 0" style-hover="color:#FFC907">Artigos</a>
    <a href="/time" style="color:#F4F2EC;padding:12px 0" style-hover="color:#FFC907">Time</a>
  </nav>
</header>
<article data-screen-label="Artigo" style="flex:1;padding:clamp(32px,5vw,64px) clamp(20px,5vw,72px) clamp(64px,9vw,120px)">
  <div style="max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(28px,4vw,44px)">
    <a href="/artigos" style="align-self:flex-start;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#8C8A82;padding:12px 0" style-hover="color:#FFC907">← Artigos</a>
    <sc-if value="{{ achou }}" hint-placeholder-val="{{ true }}">
      <header style="display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8C8A82"><span>{{ artigo.dataFmt }}</span><span style="color:#FFC907">{{ artigo.autor }}</span></div>
        <h1 style="margin:0;font-family:'arpona','Figtree',sans-serif;font-weight:800;font-size:clamp(38px,6vw,72px);line-height:0.98;letter-spacing:-0.03em;color:#F4F2EC;text-wrap:balance">{{ artigo.titulo }}</h1>
        <p style="margin:0;font-size:clamp(18px,1.8vw,21px);line-height:1.55;color:#B8B5AC;text-wrap:pretty">{{ artigo.resumo }}</p>
      </header>
      <div style="display:flex;flex-direction:column;gap:22px;padding-top:8px;border-top:1px solid #2A2924">
        <sc-for list="{{ blocos }}" as="b" hint-placeholder-count="3">
          <sc-if value="{{ b.isP }}" hint-placeholder-val="{{ true }}">
            <p style="margin:0;font-size:clamp(17px,1.4vw,19px);line-height:1.75;color:#D9D6CD;text-wrap:pretty">{{ b.texto }}</p>
          </sc-if>
          <sc-if value="{{ b.isH }}" hint-placeholder-val="{{ false }}">
            <h2 style="margin:18px 0 0;font-family:'arpona','Figtree',sans-serif;font-weight:800;font-size:clamp(24px,2.6vw,32px);line-height:1.1;letter-spacing:-0.015em;color:#F4F2EC;text-wrap:balance">{{ b.texto }}</h2>
          </sc-if>
          <sc-if value="{{ b.isQ }}" hint-placeholder-val="{{ false }}">
            <blockquote style="margin:14px 0;font-family:'arpona','Figtree',sans-serif;font-style:italic;font-weight:800;font-size:clamp(26px,3.2vw,40px);line-height:1.12;letter-spacing:-0.015em;color:#FFC907;text-wrap:balance">{{ b.texto }}</blockquote>
          </sc-if>
          <sc-if value="{{ b.isImg }}" hint-placeholder-val="{{ false }}">
            <figure style="margin:14px auto;width:100%;max-width:{{ b.maxW }};display:flex;flex-direction:column;gap:10px">
              <img src="{{ b.src }}" alt="{{ b.legenda }}" style="width:100%;height:auto;display:block;box-shadow:0 12px 32px rgba(0,0,0,0.4)">
              <sc-if value="{{ b.legenda }}" hint-placeholder-val="{{ true }}">
                <figcaption style="font-size:14px;line-height:1.5;color:#8C8A82;text-align:center;text-wrap:balance">{{ b.legenda }}</figcaption>
              </sc-if>
            </figure>
          </sc-if>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ naoAchou }}" hint-placeholder-val="{{ false }}">
      <h1 style="margin:0;font-family:'arpona','Figtree',sans-serif;font-weight:800;font-size:clamp(36px,5vw,60px);line-height:1;color:#F4F2EC">Artigo não encontrado.</h1>
    </sc-if>
  </div>
</article>
<footer style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px clamp(16px,4vw,56px);border-top:1px solid #2A2924;font-size:13px;color:#8C8A82">
  <span>©2026 Boanerges Produções, Ltda.</span>
  <span>Todos os direitos reservados</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lista: null, pronto: false };
  componentDidMount() {
    const go = () => { if (window.BOANERGES_ARTIGOS) { this.setState({ lista: window.BOANERGES_ARTIGOS, pronto: true }); return true; } return false; };
    if (!go()) { let n = 0; this.iv = setInterval(() => { if (go() || ++n > 100) { clearInterval(this.iv); this.setState({ pronto: true }); } }, 50); }
  }
  componentWillUnmount() { clearInterval(this.iv); }
  fmt(d) {
    const m = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    const [y, mo, da] = String(d || '').split('-').map(Number);
    return y ? da + ' de ' + m[mo - 1] + ', ' + y : '';
  }
  publicados() {
    return (this.state.lista || []).filter(a => !a.rascunho).slice().sort((a, b) => String(b.data).localeCompare(String(a.data)));
  }
  componentDidUpdate() {
    const a = this.atual();
    if (a) document.title = a.titulo + ' — Boanerges';
  }
  atual() {
    const pub = this.publicados();
    const slug = new URLSearchParams(location.search).get('a');
    return slug ? (this.state.lista || []).find(a => a.slug === slug) : pub[0];
  }
  renderVals() {
    const a = this.atual();
    const blocos = ((a && a.corpo) || []).map(b => {
      if (typeof b === 'string') return { isP: true, texto: b };
      if (b.titulo) return { isH: true, texto: b.titulo };
      if (b.citacao) return { isQ: true, texto: b.citacao };
      if (b.imagem) return { isImg: true, src: b.imagem, legenda: b.legenda || '', maxW: b.tamanho === 'pequena' ? '320px' : '100%' };
      return {};
    });
    return {
      artigo: a ? { ...a, dataFmt: this.fmt(a.data) } : {},
      achou: !!a, naoAchou: this.state.pronto && !a,
      blocos
    };
  }
}
</script>
</body>
</html>
