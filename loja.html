<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<style id="no-flash">html,body{background:#0A0A09;color:#F4F2EC;margin:0}</style>
<script src="./support.js"></script>
</head>
<body style="background:#0A0A09">
<x-dc>
<helmet>
<title>Loja — Boanerges</title>
<link rel="icon" type="image/png" href="assets/brand/symbol-yellow.png">
<link rel="apple-touch-icon" href="assets/brand/symbol-yellow.png">
<link rel="stylesheet" href="https://use.typekit.net/lki5cby.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth;scroll-padding-top:56px;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
body{margin:0;background:#0A0A09;color:#F4F2EC;font-family:'arpona','Figtree',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#FFC907;text-decoration:none}
a:hover{color:#F4F2EC}
</style>
</helmet>
<div style="min-height:100vh;background:#0A0A09;display:flex;flex-direction:column">
<header style="position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(12px,2.5vw,22px) clamp(16px,4vw,56px);background:rgba(10,10,9,0.86);backdrop-filter:blur(8px)">
  <a href="/" style="display:flex;align-items:center">
    <img src="assets/brand/symbol-yellow.png" alt="Boanerges" style="height:clamp(24px,6vw,30px);width:auto;display:block;flex-shrink:0">
  </a>
  <nav style="display:flex;align-items:center;gap:clamp(10px,2.6vw,40px);font-size:clamp(9.5px,2.6vw,13px);font-weight:600;letter-spacing:clamp(0.02em,0.5vw,0.08em);text-transform:uppercase;white-space:nowrap">
    <a href="/" style="color:#F4F2EC;padding:12px 0" style-hover="color:#FFC907">Home</a>
    <a href="/lancamentos" style="color:#F4F2EC;padding:12px 0" style-hover="color:#FFC907">Lançamentos</a>
    <a href="/loja" style="color:#FFC907;padding:12px 0" style-hover="color:#FFC907">Loja</a>
    <a href="/artigos" style="color:#F4F2EC;padding:12px 0" style-hover="color:#FFC907">Artigos</a>
    <a href="/time" style="color:#F4F2EC;padding:12px 0" style-hover="color:#FFC907">Time</a>
  </nav>
</header>
<section data-screen-label="Loja" style="padding:clamp(56px,9vw,120px) clamp(20px,5vw,72px) clamp(32px,5vw,56px)">
  <div style="max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px">
    <div style="font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8C8A82">Boanerges</div>
    <h1 style="margin:0;font-family:'arpona','Figtree',sans-serif;font-weight:800;font-size:clamp(48px,11vw,150px);line-height:0.88;letter-spacing:-0.035em;color:#FFC907">Loja</h1>
  </div>
</section>
<section style="flex:1;padding:0 clamp(20px,5vw,72px) clamp(64px,9vw,120px)">
  <div style="max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(28px,4vw,40px)">
    <sc-for list="{{ produtos }}" as="p" hint-placeholder-count="0">
      <a href="{{ p.link }}" style="display:flex;flex-direction:column;gap:14px;color:#F4F2EC" style-hover="color:#FFC907">
        <img src="{{ p.capa }}" alt="{{ p.titulo }}" style="width:100%;aspect-ratio:2/3;object-fit:cover;display:block;border:1px solid #2A2924">
        <div style="font-family:'arpona','Figtree',sans-serif;font-weight:800;font-size:22px;line-height:1.1">{{ p.titulo }}</div>
        <div style="font-size:15px;font-weight:600;color:#FFC907">{{ p.preco }}</div>
      </a>
    </sc-for>
    <sc-if value="{{ vazio }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:20px;padding:clamp(40px,6vw,72px) 0;border-top:1px solid #2A2924;border-bottom:1px solid #2A2924">
        <p style="margin:0;font-family:'arpona','Figtree',sans-serif;font-style:italic;font-weight:500;font-size:clamp(24px,3vw,36px);color:#D9D6CD">Títulos disponíveis em breve...</p>
        <a href="/lancamentos" style="align-self:flex-start;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#FFC907;padding:12px 0;border-bottom:2px solid #FFC907" style-hover="color:#F4F2EC">Ver lançamentos →</a>
      </div>
    </sc-if>
  </div>
</section>
<footer style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:24px clamp(16px,4vw,56px);border-top:1px solid #2A2924;font-size:13px;color:#8C8A82">
  <span>©2026 Boanerges Produções, Ltda.</span>
  <nav aria-label="Redes sociais" style="display:flex;align-items:center;gap:4px;margin:-10px -10px -10px 0">
    <a href="https://www.instagram.com/boanerges.co/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:#8C8A82;transition:color .2s ease" style-hover="color:#FFC907"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"></circle></svg></a>
  </nav>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // Para adicionar produtos: { titulo, preco, capa, link } — link pode ser a página de compra (ex.: Amazon, loja própria)
  produtos = [];
  renderVals() {
    return { produtos: this.produtos, vazio: this.produtos.length === 0 };
  }
}
</script>
</body>
</html>
